[package]
name = "omniapi-desktop"
# Same as the project version (scripts/build_release.py checks it with tauri.conf.json):
# this one becomes the exe's file version, tauri.conf.json's the installer's.
version = "1.3.0"
description = "OmniAPI desktop shell: tray icon, dashboard window, and the local service's life"
authors = ["Kosa"]
edition = "2021"

[lib]
name = "omniapi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Compile the development default (config/shell.dev.json, the checkout's own mcp/.venv) into a
# release build too. Debug builds always have it; the shipped exe must not (see src/config.rs).
dev-default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Pinned: 2.5.x (auto-launch 0.5) writes the logon entry for the current user only (HKCU), which
# is what a per-user install wants and what `omni autostart status` reads. 2.7 (auto-launch 0.6)
# tries the all-users key (HKLM) first and only falls back to HKCU when that is denied.
tauri-plugin-autostart = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 16
lto = false
opt-level = "s"
strip = true
