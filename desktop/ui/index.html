<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniAPI</title>
<!-- 字型同看板的 D3 主題（gui/index.html）；離線時退到系統字 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 桌面殼的「正在啟動」頁：服務還沒回應時視窗先顯示這頁，殼用 eval 把狀態送進來（window.omniShell.update），
     服務一回應殼就把視窗轉去看板。色彩、字型、材質照 gui/src/themes/d3.css（孔版雙色疊印）：
     紙＋墨四階＋三油墨，方角，steps() 的分格動效。 */
  :root {
    --paper: #e9ecee; --paper-deep: #dfe3e6;
    --ink: #1f2330; --ink-70: rgba(31,35,48,.7); --ink-45: rgba(31,35,48,.45); --ink-25: rgba(31,35,48,.25);
    --riso-pink: #ff48b0; --riso-blue: #0078bf; --riso-yellow: #ffe800;
    --font-display: "Bricolage Grotesque", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-kai: "LXGW WenKai TC", "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
    --font-label: "Bricolage Grotesque", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --font-mono: "IBM Plex Mono", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", monospace;
    --err-stripe: repeating-linear-gradient(135deg, var(--ink-25) 0 1.5px, transparent 1.5px 6px);
    --halftone: radial-gradient(rgba(31,35,48,.14) 1.1px, transparent 1.35px) 0 0/5px 5px;
    --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .122  0 0 0 0 .137  0 0 0 0 .188  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    --m: clamp(16px, 4vw, 40px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font: 14px/1.55 var(--font-sans); -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: var(--grain); opacity: .28; mix-blend-mode: multiply; }
  header { padding: 22px var(--m) 0; display: flex; align-items: baseline; gap: 10px; }
  .logo { font-family: var(--font-display); font-weight: 800; font-size: 32px; letter-spacing: -.035em; line-height: 1; font-variation-settings: "wdth" 80; }
  .logo small { font: 600 10px var(--font-label); letter-spacing: .14em; color: var(--ink-70); }
  /* 套印字：藍版在下，粉版偏移 multiply（同 gui/src/styles/base.css 的 .ovp） */
  .ovp { position: relative; display: inline-block; color: var(--riso-blue); isolation: isolate; }
  .ovp::after { content: attr(data-t); position: absolute; left: 0; top: 0; color: var(--riso-pink); mix-blend-mode: multiply; transform: translate(.05em, -.035em); pointer-events: none; }
  main { flex: 1; display: flex; align-items: center; padding: 24px var(--m) 32px; }
  .card { width: 100%; max-width: 720px; margin: 0 auto; }
  .lbl { font: 600 11px var(--font-label); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-70); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 7vw, 50px); line-height: 1.15; letter-spacing: -.02em; font-variation-settings: "wdth" 80; margin: 10px 0 18px; }
  .row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  /* 滾筒：分格轉（同看板的 --drum-anim） */
  .drum { width: 54px; height: 54px; border: 6px dashed var(--ink); border-radius: 50%; animation: spin 1.6s steps(24) infinite; flex: none; }
  .drum.idle { animation: none; border-style: solid; border-color: var(--ink-25); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .waited { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .waited b { font-size: clamp(38px, 9vw, 56px); font-weight: 500; line-height: .95; }
  .waited span { font-size: 13px; color: var(--ink-70); margin-left: 6px; }
  .note { font-family: var(--font-kai); font-size: 17px; line-height: 1.6; margin: 22px 0 0; max-width: 34em; }
  .why { margin: 20px 0 0; padding: 14px 16px; border: 1.5px solid var(--ink); background: var(--paper-deep); position: relative; }
  .why::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 8px; background: var(--err-stripe); }
  .why p { margin: 0 0 0 10px; font-size: 15px; }
  .logs { margin: 18px 0 0; }
  .logs ul { list-style: none; margin: 6px 0 0; padding: 0; }
  .logs li { font: 12px/1.7 var(--font-mono); overflow-wrap: anywhere; }
  .acts { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
  button { font: 600 14px var(--font-sans); cursor: pointer; border: 1.5px solid var(--ink); padding: 9px 16px; background: transparent; color: var(--ink); border-radius: 0; }
  button.primary { background: var(--ink); color: var(--paper); }
  button:hover { background: var(--riso-yellow); color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; background: transparent; color: var(--ink); }
  footer { padding: 0 var(--m) 18px; font: 11px var(--font-mono); color: var(--ink-45); display: flex; gap: 16px; flex-wrap: wrap; }
  .hide { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .drum { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="ovp" data-t="OmniAPI">OmniAPI</span></div>
  <small class="lbl">桌面版</small>
</header>
<main>
  <div class="card">
    <div class="lbl" id="kicker">SERVICE · STARTING</div>
    <h1 id="title">正在啟動服務</h1>
    <div class="row" id="waitRow">
      <div class="drum" id="drum" aria-hidden="true"></div>
      <div class="waited" id="waited"><b id="secs">0</b><span>秒</span></div>
    </div>
    <p class="note" id="note">第一次啟動（或更新後的第一次）要準備的東西比較多，可能要半分鐘以上；之後通常十秒左右。好了會自動打開看板。</p>
    <div class="why hide" id="why"><p id="whyText"></p></div>
    <div class="logs hide" id="logs">
      <div class="lbl">紀錄</div>
      <ul id="logList"></ul>
    </div>
    <div class="acts hide" id="acts">
      <button class="primary" id="retry" type="button">再試一次</button>
      <button id="openLogs" type="button">開啟紀錄資料夾</button>
    </div>
  </div>
</main>
<footer><span id="where">127.0.0.1</span><span id="pid"></span></footer>
<script>
  // 狀態從殼來：建視窗時的 window.__OMNI_SHELL__，之後每次變化殼呼叫 window.omniShell.update(s)。
  // s = { phase: starting|up|down|failed|stopping|disabled, port, pid, failures, maxFailures,
  //       problem, retryInSecs, startingSinceMs, logDir }
  const $ = (id) => document.getElementById(id);
  const invoke = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
  let s = window.__OMNI_SHELL__ || null;
  let since = Date.now();

  function show(el, on) { el.classList.toggle("hide", !on); }

  function render() {
    if (!s) return;
    $("where").textContent = "127.0.0.1:" + s.port;
    $("pid").textContent = s.pid ? "pid " + s.pid : "";
    if (s.startingSinceMs) since = s.startingSinceMs;
    const phase = s.phase;
    const failed = phase === "failed";
    const waiting = phase === "starting" || phase === "down" || phase === "stopping";
    $("drum").classList.toggle("idle", !waiting);
    show($("waitRow"), phase !== "failed" && phase !== "disabled");
    show($("waited"), phase === "starting");
    show($("why"), !!s.problem && (failed || phase === "down"));
    $("whyText").textContent = s.problem || "";
    show($("logs"), failed);
    show($("acts"), failed && !!invoke);
    show($("note"), phase !== "failed");
    if (failed && s.logDir) {
      const ul = $("logList");
      ul.textContent = "";
      for (const f of ["shell.log", "daemon.log", "service.console.log"]) {
        const li = document.createElement("li");
        li.textContent = s.logDir + "\\" + f;
        ul.appendChild(li);
      }
    }
    const T = {
      starting: ["SERVICE · STARTING", "正在啟動服務", "第一次啟動（或更新後的第一次）要準備的東西比較多，可能要半分鐘以上；之後通常十秒左右。好了會自動打開看板。"],
      down: ["SERVICE · NOT RESPONDING", "服務沒有回應，正在重新啟動",
        s.retryInSecs ? "第 " + s.failures + " 次重試，" + s.retryInSecs + " 秒後開始。" : "正在重新啟動；好了會自動打開看板。"],
      failed: ["SERVICE · STOPPED TRYING", "服務起不來", ""],
      stopping: ["SERVICE · STOPPING", "正在停止服務", "請稍候。"],
      up: ["SERVICE · UP", "服務好了，正在打開看板", ""],
      disabled: ["SERVICE · NOT MANAGED", "等服務起來", "這個桌面版的設定不管理服務（service.enabled = false）。服務在這個埠回應後，看板會自動打開。"],
    }[phase] || ["SERVICE", phase, ""];
    $("kicker").textContent = T[0];
    $("title").textContent = T[1];
    $("note").textContent = T[2];
    if (failed) {
      $("note").textContent = "";
    }
    tick();
  }

  function tick() {
    $("secs").textContent = String(Math.max(0, Math.round((Date.now() - since) / 1000)));
  }

  window.omniShell = { update(next) { s = next; render(); } };
  setInterval(tick, 1000);

  if (invoke) {
    $("retry").addEventListener("click", async () => {
      $("retry").disabled = true;
      try { await invoke("retry_service"); } catch (e) { console.error(e); }
      setTimeout(() => { $("retry").disabled = false; }, 3000);
    });
    $("openLogs").addEventListener("click", () => invoke("open_logs").catch(console.error));
  }

  if (s) {
    render();
  } else {
    // Opened outside the shell (development): find the service ourselves. no-cors: the service has
    // no CORS headers; an opaque answer still proves it is there.
    const port = Number(new URLSearchParams(location.search).get("port")) || 7788;
    s = { phase: "starting", port };
    render();
    (async function poll() {
      try {
        await fetch("http://127.0.0.1:" + port + "/api/health", { mode: "no-cors", cache: "no-store" });
        location.replace("http://127.0.0.1:" + port + "/");
        return;
      } catch (e) { /* not up yet */ }
      setTimeout(poll, 2000);
    })();
  }
</script>
</body>
</html>
