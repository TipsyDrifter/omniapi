[tool.hatch.build.targets.wheel]
packages = ["omniapi_mcp"]

[project]
name = "omniapi-mcp"
version = "1.2.0"
description = "OmniAPI — a unified MCP server and local dispatch center (daemon, web GUI, CLI) routing requests to multiple AI provider APIs: image, transcription, text/chat, speech, music, and headless agent runs. Forked from image-gen-mcp."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.10,<2",
    "openai",
    "pillow",
    "python-dotenv",
    "pydantic",
    "httpx[socks]",
    "aiofiles",
    "google-genai>=1.0.0",
    "google-auth",
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "aiosqlite>=0.22.1",
    "uvicorn[standard]>=0.35.0",
    "claude-agent-sdk>=0.2.159",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "respx>=0.20.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
cache = [
    "redis>=4.0.0",
]

[project.scripts]
omniapi-mcp = "omniapi_mcp.server:main"
omni = "omniapi_mcp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that make real API calls (skipped by default, use --run-integration)",
    "slow: marks slow-running tests",
    "unit: marks unit tests",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.1",
]
